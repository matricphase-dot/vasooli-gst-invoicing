services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: vasooli
      POSTGRES_PASSWORD: "CHANGE-ME-dev-db-password"
    volumes:
      - vasooli_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "CHANGE-ME-dev-redis-password"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: vasooli_test
      POSTGRES_PASSWORD: "6h9B06lIDr0FAHGHVyiqPYHARjluzpLj"
    volumes:
      - vasooli_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "21t49_BuWvrYgWCakElIqEYpdnB1TSQS"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  vasooli_data:
  vasooli_test_data:
